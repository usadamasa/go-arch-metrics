# https://github.com/Songmu/tagpr
name: tagpr

"on":
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # GITHUB_TOKEN が作った PR / tag は workflow を起動しない｡だで release PR には
      # ci.yaml が付かない｡CI を走らせたくなったら他リポジトリと同じく
      # actions/create-github-app-token@v2 (vars.TAGPR_APP_ID / secrets.TAGPR_PRIVATE_KEY)
      # へ差し替える｡
      - uses: Songmu/tagpr@v1
        id: tagpr
        env:
          GITHUB_TOKEN: ${{ github.token }}
