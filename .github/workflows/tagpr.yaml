# https://github.com/Songmu/tagpr
name: tagpr

"on":
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # GITHUB_TOKEN では release PR を作れない (403 "GitHub Actions is not permitted
      # to create or approve pull requests")｡加えて GITHUB_TOKEN が作った PR や tag は
      # workflow を起動しないため､release PR に ci.yaml が付かない｡どちらも
      # usadamasa-tagpr App のトークンで解決する｡
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.TAGPR_APP_ID }}
          private-key: ${{ secrets.TAGPR_PRIVATE_KEY }}

      - uses: Songmu/tagpr@v1
        id: tagpr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
