name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Go と lint・テストのツールは flake.nix の devShell から取る (.github/actions/setup-nix)。
jobs:
  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: $/.github/actions/setup-nix

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.out

  go-lint:
    name: go lint
    runs-on: ubuntu-latest
    steps:
      # analyze-modularity --strict は git の履歴で揮発性を測る。shallow clone だと測らずに揮発として扱う
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - uses: $/.github/actions/setup-nix

      - name: Run all linters
        run: task lint

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: $/.github/actions/setup-nix

      - name: Run shellcheck
        run: shellcheck skills/*/scripts/*.sh .github/scripts/*.sh

  # 利用側が flake input で参照する packages.default を Linux でビルドし、CLI を実際に動かす
  nix-package:
    name: nix package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      # smoke は go と go-arch-lint を PATH に要るので devShell も入れる
      - uses: $/.github/actions/setup-nix

      - name: Build packages.default
        run: nix build .#default --out-link result -L

      - name: Smoke test
        run: .github/scripts/nix-package-smoke.sh "$PWD/result/bin"

  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      # baseline.sh のテストは fixture の Go module を go test で回すので、bats と一緒に devShell の go も使う
      - uses: $/.github/actions/setup-nix

      - name: Run bats tests
        run: bats tests/

  plugin-validate:
    name: plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      # ubuntu-latest は node と npm を同梱するので setup-node は要らない。
      # nodejs は devShell に入れず setup-nix も通さない。devShell の npm は global prefix が /nix/store になり npm i -g が落ちる
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Validate manifests and skills
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict skills

  # action は uses: にタグを書き、commit SHA は .github/workflows/actions.lock が固定する
  actions-lock:
    name: actions-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Verify actions are locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  ci-status-check:
    needs: [go-test, go-lint, bats, shellcheck, nix-package, plugin-validate, actions-lock]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
