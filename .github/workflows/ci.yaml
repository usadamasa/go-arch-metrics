name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Go と lint・テストのツールは flake.nix の devShell から取る (.github/actions/setup-nix)。
jobs:
  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nix

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  go-lint:
    name: go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nix

      - name: Run all linters
        run: task lint

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-nix

      - name: Run shellcheck
        run: shellcheck skills/*/scripts/*.sh

  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # baseline.sh のテストは fixture の Go module を go test で回すので、bats と一緒に devShell の go も使う
      - uses: ./.github/actions/setup-nix

      - name: Run bats tests
        run: bats tests/

  plugin-validate:
    name: plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ubuntu-latest は node と npm を同梱するので setup-node は要らない。
      # nodejs は devShell に入れず setup-nix も通さない。devShell の npm は global prefix が /nix/store になり npm i -g が落ちる
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Validate manifests and skills
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict skills

  ci-status-check:
    needs: [go-test, go-lint, bats, shellcheck, plugin-validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
