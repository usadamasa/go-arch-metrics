version: 2
updates:
  # 3 つとも group は作らず、パッケージごとに PR を出させる。group の PR が開いた
  # ままだと同じ group の更新が全部止まり、1 つの更新の不具合で他の更新まで
  # 巻き添えになる。
  #
  # go.sum が変わると flake.nix の packages.default の vendorHash がずれ、CI の
  # nix-package ジョブが hash mismatch で落ちる。Dependabot は vendorHash を
  # 上げないので、その PR のブランチで got: の値に付け直す。
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  # Dependabot は `uses:` のタグと actions.lock の SHA を同じ commit で上げるので、
  # CI の actions-lock ジョブ (`gh actions-lock --verify`) を通る。
  #
  # directory: / は .github/workflows/ しか見ず、composite action
  # (.github/actions/*) の uses: を上げないので directories で足す。composite
  # action 側の bump で actions.lock も上がるかは未確認 (2026-10)。actions-lock
  # ジョブで落ちたら、その PR のブランチで `gh actions-lock` を実行する。
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly

  # devShell の Go と lint ツールの版は flake.lock の nixpkgs の rev で決まる。
  # nix の対象は flake.lock の input の更新だけで、security updates は出ない。
  # flake.nix の devGo の差し替えは channel の go_1_26 が追いつくと外れ、以後の
  # Go のパッチ更新もこの PR に乗る。1.26 から 1.27 への系列上げは対象外。
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
