version: 2
updates:
  # 3 つとも group は作らず、パッケージごとに PR を出させる。group の PR が開いた
  # ままだと同じ group の更新が全部止まり、1 つの更新の不具合で他の更新まで
  # 巻き添えになる。
  #
  # go.sum が変わると flake.nix の packages.default の vendorHash がずれ、CI の
  # nix-package ジョブが hash mismatch で落ちる。Dependabot は vendorHash を
  # 上げないので、その PR のブランチで got: の値に付け直す。
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # tag の無い module で、Dependabot は親の x/crypto の tag を当てて解決に失敗する。
      # 代わりに .github/workflows/update-x509roots.yaml が上げる
      - dependency-name: golang.org/x/crypto/x509roots/fallback

  # Dependabot は `uses:` のタグと actions.lock の SHA を同じ commit で上げるので、
  # CI の actions-lock ジョブ (`gh actions-lock --verify`) を通る。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # devShell の Go と lint ツールの版は flake.lock の nixpkgs の rev で決まる。
  # nix の対象は flake.lock の input の更新だけで、security updates は出ない。
  # flake.nix の patchGo の差し替えは channel の go_1_27 が 1.27.4 に追いつくと外れ、
  # 以後の Go のパッチ更新もこの PR に乗る。1.27 から 1.28 への系列上げは対象外。
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
