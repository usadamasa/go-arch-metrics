version: 3

workdir: .

# この設定自体の健全性は `go run ./cmd/analyze-arch-lint --metrics` と `--strict .` で見る｡
# cmd/ 配下の main パッケージと、それらが共有する internal の構成｡
# cmd 専用の internal を足したら cmd_internal を切ること
# (skills/remediate/references/arch-lint-remediation.md)｡
components:
  cmd_main:
    in: "cmd/*"
  shared_internal:
    in: "internal/**"

vendors:
  yaml:
    in: gopkg.in/yaml.v3
  # cmd/vulncheck が govulncheck を組み込むための 2 つ
  vuln:
    in: golang.org/x/vuln/scan
  x509roots:
    in: golang.org/x/crypto/x509roots/fallback
  # cmd/analyze-modularity が外からの参照を型情報で解くため
  packages:
    in: golang.org/x/tools/go/packages

deps:
  # shared_internal は entry を持たない = 標準ライブラリ以外に依存できない
  cmd_main:
    mayDependOn:
      - shared_internal
    canUse:
      - yaml
      - vuln
      - x509roots
      - packages
