version: '3'

tasks:
  build:
    desc: cmd/ の全 Go バイナリを bin/ にビルド
    cmds:
      - go build -o ./bin/ ./...

  test:
    desc: Go テストを実行
    cmds:
      - go test ./...

  test-cover:
    desc: カバレッジ付きテスト
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  lint:
    desc: Go の全静的解析を実行
    cmds:
      - golangci-lint run --timeout 5m ./...
      - go-arch-lint check
      # go-arch-lint はコードが設定に違反していないかしか見ない｡設定そのものが
      # パッケージツリーの転記へ劣化していく方向はこちらが止める｡指標の意味と対処は
      # analyze-arch-lint --metrics｡
      - go run ./cmd/analyze-arch-lint --strict .
      - task: vulncheck
      - gosec ./...
      - go run ./cmd/analyze-modularity --strict .

  vulncheck:
    desc: govulncheck を symbol と module の両方で実行 (lint と週次の vulncheck workflow が呼ぶ)
    cmds:
      # govulncheck は cmd/vulncheck に組み込んである (sandbox の中でも証明書の検証が通る形)
      - go run ./cmd/vulncheck ./...
      # -scan module はルートに Go ファイルが無いと落ちるので、main パッケージのディレクトリで回す
      - go run ./cmd/vulncheck -C cmd/vulncheck -scan module
