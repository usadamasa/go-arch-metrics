version: '3'

tasks:
  build:
    desc: cmd/ の全 Go バイナリを bin/ にビルド
    cmds:
      - go build -o ./bin/ ./...

  test:
    desc: Go テストと baseline.sh の bats テストを実行
    cmds:
      - go test ./...
      - bats tests/

  test-cover:
    desc: カバレッジ付きテスト
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  lint:
    desc: Go の全静的解析を実行
    env:
      # spm-go がローカルレジストリ由来なので policy を渡す (CI は direnv を通らない)｡
      AQUA_POLICY_CONFIG: '{{.TASKFILE_DIR}}/aqua/policy.yaml'
    cmds:
      - golangci-lint run --timeout 5m ./...
      - go-arch-lint check
      # go-arch-lint はコードが設定に違反していないかしか見ない｡設定そのものが
      # パッケージツリーの転記へ劣化していく方向はこちらが止める｡指標の意味と対処は
      # analyze-arch-lint --metrics｡
      - go run ./cmd/analyze-arch-lint --strict .
      - govulncheck ./...
      - gosec ./...
      - go run ./cmd/analyze-modularity --strict .
      - spm-go all
